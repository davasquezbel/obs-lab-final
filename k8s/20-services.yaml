# Los tres microservicios. Secrets requeridos (los crea scripts/deploy.sh):
#   db-credentials (DB_PASSWORD) y auth-users (AUTH_USERS)
# ─────────────────────────── data-service ───────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-service
  namespace: otel-lab
  labels:
    app: data-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: data-service
  template:
    metadata:
      annotations:
        sidecar.istio.io/proxyCPU: "50m"
        sidecar.istio.io/proxyMemory: "96Mi"
        proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
      labels:
        app: data-service
        version: v1
    spec:
      serviceAccountName: data-service
      containers:
        # Sidecar clásico (contenedor regular). El injector de Cloud Service Mesh
        # no preserva restartPolicy en sidecars nativos (initContainers), por eso
        # el proxy va aquí; data-service reintenta la conexión hasta que esté listo.
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.3
          args:
            - "--structured-logs"
            - "--port=5432"
            - "--auto-iam-authn=false"
            - "--health-check"
            - "--http-address=0.0.0.0"
            - "--telemetry-project=obs-lab-final"
            - "--telemetry-prefix=cloudsqlproxy"
            - "obs-lab-final:us-central1:obs-lab-pg"
          startupProbe:
            httpGet:
              path: /startup
              port: 9090
            periodSeconds: 1
            failureThreshold: 60
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
        - name: data-service
          image: us-central1-docker.pkg.dev/obs-lab-final/obs-lab/data-service:1.0.3
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - configMapRef:
                name: otel-lab-config
          env:
            - name: PORT
              value: "8002"
            - name: DB_HOST
              value: "127.0.0.1"
            - name: DB_NAME
              value: appdb
            - name: DB_USER
              value: app
            - name: CLOUDSQL_INSTANCE
              value: obs-lab-final:us-central1:obs-lab-pg
            - name: CHAOS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chaos-token
                  key: CHAOS_TOKEN
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: DB_PASSWORD
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.namespace.name=otel-lab,k8s.pod.name=$(K8S_POD_NAME),k8s.container.name=data-service"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: data-service
  namespace: otel-lab
  labels:
    app: data-service
spec:
  selector:
    app: data-service
  ports:
    - name: http
      port: 8002
      targetPort: 8002
