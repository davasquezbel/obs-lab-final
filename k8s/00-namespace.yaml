apiVersion: v1
kind: Namespace
metadata:
  name: otel-lab
  labels:
    lab: obs-lab-final
    environment: sandbox
---
# KSAs con Workload Identity → GSAs creadas por Terraform (infra/terraform/iam.tf)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: otel-lab
  annotations:
    iam.gke.io/gcp-service-account: otel-collector@obs-lab-final.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-service
  namespace: otel-lab
  annotations:
    iam.gke.io/gcp-service-account: data-service@obs-lab-final.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-a
  namespace: otel-lab
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: service-b
  namespace: otel-lab
---
# Configuración común de telemetría inyectada en los tres servicios
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-lab-config
  namespace: otel-lab
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
  GOOGLE_CLOUD_PROJECT: "obs-lab-final"
  ENVIRONMENT: "sandbox"
  APP_VERSION: "1.0.0"
  SERVICE_B_URL: "http://service-b:8001"
  DATA_SERVICE_URL: "http://data-service:8002"
