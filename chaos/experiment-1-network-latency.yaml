# Experimento de caos 1 — Latencia de red de 200 ms en service-b
#
# Hipótesis de estado estable: con +200 ms en service-b, el sistema sigue respondiendo
# sin errores, pero el p99 de service-a supera el SLO de latencia (300 ms); la plataforma
# de observabilidad debe detectarlo y alertar en < 2 min (MTTD), con trace_id accionable.
#
# Blast radius: solo los pods app=service-b del namespace otel-lab (sandbox).
# Rollback automático: Chaos Mesh retira la regla tc al cumplirse `duration`.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: exp1-latency-service-b
  namespace: otel-lab
  labels:
    experiment: chaos-exp-1
spec:
  action: delay
  mode: all
  selector:
    namespaces: [otel-lab]
    labelSelectors:
      app: service-b
  delay:
    latency: "200ms"
    jitter: "0ms"
    correlation: "100"
  direction: to
  duration: "300s"
